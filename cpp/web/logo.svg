<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="brGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Emerald-Cyan Linear Gradient -->
    <linearGradient id="brGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Core Pulse Gradient -->
    <linearGradient id="brCoreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <filter id="brShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#brGlow)"/>

  <!-- Outer Rounded Shield / Hexagon -->
  <path d="M60 12 L98 28 L98 68 C98 88 82 104 60 110 C38 104 22 88 22 68 L22 28 Z"
        stroke="url(#brGrad)" stroke-width="4.5" stroke-linejoin="round" fill="none" filter="url(#brShadow)"/>

  <!-- Inner High-Tech Lifesaver / Digital Recovery Ring -->
  <circle cx="60" cy="58" r="26" stroke="url(#brGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="24 16.8"/>

  <!-- Center Core: Restored Data Bit / Pulse Spark -->
  <path d="M60 42 L64 54 L76 58 L64 62 L60 74 L56 62 L44 58 L56 54 Z"
        fill="url(#brCoreGrad)"/>

  <!-- Four Data Rescue Cross Segments -->
  <circle cx="60" cy="32" r="3.5" fill="#22d3ee"/>
  <circle cx="60" cy="84" r="3.5" fill="#10b981"/>
  <circle cx="34" cy="58" r="3.5" fill="#10b981"/>
  <circle cx="86" cy="58" r="3.5" fill="#22d3ee"/>
</svg>
